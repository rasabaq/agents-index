<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <!-- Only this site may run scripts, so markup slipped into the data cannot run. Styles allow inline for style="" and the charts' <style> blocks.
       Images also allow GitHub, where repo logos come from. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://github.com https://avatars.githubusercontent.com; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#05060b">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Page not found · AI Agent Observatory</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff2e88'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%2305060b'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/hero.css">
  <style>
    .lost { display: grid; justify-items: center; align-content: center; gap: 18px; min-height: calc(100svh - 61px); padding-block: 48px; text-align: center; }
    .lost .lost-code { margin: 0; font: 400 clamp(120px, 30vw, 220px)/0.8 var(--pixel); color: var(--magenta); text-shadow: 0 0 60px rgba(255, 46, 136, 0.35); }
    .lost h1 { font-size: clamp(28px, 6vw, 44px); letter-spacing: -0.045em; text-wrap: balance; }
    .lost p { margin: 0; max-width: 42ch; color: var(--ink-2); text-wrap: balance; }
    .lost .hero-btn { margin-top: 10px; }
  </style>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="/" aria-label="AI Agent Observatory, home">
        <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="14" class="brand-ring"/><circle cx="16" cy="16" r="5" class="brand-core"/></svg>
        <span>AI Agent Observatory</span>
      </a>
    </div>
  </header>
  <main class="wrap lost">
    <p class="kicker">Error 404</p>
    <p class="lost-code" aria-hidden="true">404</p>
    <h1>This page is not on the map.</h1>
    <p>The page you asked for does not exist, or it has moved.</p>
    <a class="hero-btn hero-btn-1" href="/">Back to the observatory <span aria-hidden="true">→</span></a>
  </main>
</body>
</html>
