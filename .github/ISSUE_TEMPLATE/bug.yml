name: Bug on the site
description: Something on the site looks wrong or doesn't work. For a wrong status, use "Data correction".
title: "Bug: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw. A screenshot helps.
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Page and browser
      placeholder: Home page, Safari on iPhone
