# Weekly dead-link check. A 404 or 410 fails the run; 403s, timeouts and other
# "could not be confirmed" links are listed in the log but pass.
name: Links

on:
  schedule:
    - cron: '0 9 * * 1' # Mondays 09:00 UTC
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check-links
